# Signal backend of ubSignal: a static library with a small C interface
# (include/ubsignal_core.h) that the Qt app links against.
[package]
name = "ubsignal-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "ubsignal_core"
crate-type = ["staticlib"]

[dependencies]
# Pinned: libsignal-service follows Signal's server changes closely, so a
# moving branch would make builds non-reproducible.
presage = { git = "https://github.com/whisperfish/presage", rev = "aeaedf99babebae2dbc6b86bca797807d4cd9fda", features = ["cdsi"] }
presage-store-sqlite = { git = "https://github.com/whisperfish/presage", rev = "aeaedf99babebae2dbc6b86bca797807d4cd9fda", features = ["cdsi"] }

futures = "0.3"
hex = "0.4"
mime_guess = "2.0"
qrcode = { version = "0.14", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[patch.crates-io]
# Same patch as the presage workspace: SQLCipher support used by its store.
libsqlite3-sys = { version = "0.36.0", git = "https://github.com/whisperfish/rusqlite", rev = "2a42b3354c9194700d08aa070f70a131a470e7dc" }

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"

# Unoptimised ML-KEM can overflow the stack while decrypting PQXDH messages.
[profile.dev.package.libcrux-ml-kem]
opt-level = 3
